global
    log /dev/log local0
    maxconn 8192
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    tcp
    option  dontlognull
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s

# Single 443 mux: terminate TLS, ALPN-demux web vs TURN (BBB pattern).
frontend mux443
    bind *:443 ssl crt /etc/haproxy/certbundle.pem alpn http/1.1,stun.turn
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len gt 0 }
    # ALPN-based routing
    use_backend web  if { ssl_fc_alpn -m str http/1.1 }
    use_backend turn if { ssl_fc_alpn -m str stun.turn }
    # No-ALPN fallback: HTTP requests start with an ASCII method letter
    # (GET/POST/HEAD/PUT/DELETE/OPTIONS/CONNECT/TRACE); STUN/TURN do not.
    acl http_first req.payload(0,1),hex -m str 47 50 48 44 4F 43 54
    use_backend web if http_first
    default_backend turn

backend web
    mode tcp
    server pony 192.168.0.108:8090

backend turn
    mode tcp
    server coturn 127.0.0.1:3478
