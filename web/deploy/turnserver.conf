# freesoft-interpret-web TURN relay — plaintext only; haproxy provides TLS on 443.
listening-port=3478
listening-ip=127.0.0.1
relay-ip=192.168.0.119
min-port=49160
max-port=49200
fingerprint
use-auth-secret
static-auth-secret=<REDACTED — see edge:/etc/coturn-shared-secret>
realm=osito.freesoft.org
# Lock relay peers to pony only (no open relay).
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=192.168.0.108
# haproxy terminates TLS; coturn is plaintext.
no-tls
no-dtls
no-cli
no-software-attribute
stale-nonce=600
log-file=stdout
